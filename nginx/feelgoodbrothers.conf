# BEGIN feelgoodbrothers: feelgoodbrothers.com (+ www, new, admin)
# Rolled out by ./deploy.sh in the feelgoodbrothers repo. The source of this block is
# nginx/feelgoodbrothers.conf in that repo; deploy.sh pastes it between these markers in the
# nginx.conf of Weggeefdeals (that nginx owns ports 80/443 on the shared VPS). Edit it there,
# not in the Weggeefdeals file.
#
# Everything is inlined: the Weggeefdeals nginx mounts only this one file. Names are prefixed
# (fgb_*) so nothing clashes with the other sites. Upstreams are resolved per request, so nginx
# starts and reloads even when the feelgoodbrothers stack is down (then only these hostnames
# give a 502, Weggeefdeals and Tint Exclusive keep working).
#
#   feelgoodbrothers.com        -> fgb-web   (Astro SSR, micro-cached)
#   new.feelgoodbrothers.com    -> fgb-web, noindex (test domain before the DNS switch)
#   www.feelgoodbrothers.com    -> 301 to feelgoodbrothers.com
#   admin.feelgoodbrothers.com  -> fgb-admin (never cached, noindex)

# micro-cache for public HTML and images: shields Postgres from traffic spikes (e.g. a viral X post)
proxy_cache_path /var/cache/nginx/fgb levels=1:2 keys_zone=fgb_web:20m max_size=500m inactive=7d use_temp_path=off;
limit_req_zone $binary_remote_addr zone=fgb_login:10m rate=10r/m;

map $host $fgb_robots {
    new.feelgoodbrothers.com "noindex, nofollow";
    default "";
}

# HTTP: ACME challenge + redirect to HTTPS
server {
    listen 80;
    server_name feelgoodbrothers.com www.feelgoodbrothers.com new.feelgoodbrothers.com admin.feelgoodbrothers.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# www -> apex
server {
    listen 443 ssl;
    server_name www.feelgoodbrothers.com;

    ssl_certificate /etc/letsencrypt/live/feelgoodbrothers.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/feelgoodbrothers.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # also over HTTPS, in case Cloudflare redirects the challenge to https
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://feelgoodbrothers.com$request_uri;
    }
}

# public site
server {
    listen 443 ssl;
    server_name feelgoodbrothers.com new.feelgoodbrothers.com;

    ssl_certificate /etc/letsencrypt/live/feelgoodbrothers.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/feelgoodbrothers.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    server_tokens off;
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_proxied any;
    gzip_vary on;
    gzip_types text/plain text/css text/xml application/xml application/rss+xml application/json application/javascript image/svg+xml;

    # real visitor IP when behind Cloudflare (proxy on). Ranges: https://www.cloudflare.com/ips/
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;

    resolver 127.0.0.11 valid=10s ipv6=off;
    set $fgb_web http://fgb-web:4321;
    proxy_connect_timeout 3s;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $host;

    # note: add_header in a location replaces the server-level ones, so every location repeats them
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header X-Robots-Tag $fgb_robots always;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # uploaded images (unique filenames, immutable): served by the app once, then from the cache
    location /media/ {
        proxy_pass $fgb_web;
        proxy_cache fgb_web;
        proxy_cache_key "$scheme$host$request_uri";
        proxy_cache_valid 200 30d;
        proxy_cache_valid 404 10s;
        access_log off;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # hashed build assets
    location /_astro/ {
        proxy_pass $fgb_web;
        proxy_cache fgb_web;
        proxy_cache_key "$scheme$host$request_uri";
        proxy_cache_valid 200 30d;
        access_log off;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location / {
        proxy_pass $fgb_web;
        proxy_cache fgb_web;
        proxy_cache_key "$scheme$host$request_uri";
        proxy_cache_methods GET HEAD;
        proxy_ignore_headers Cache-Control Expires Set-Cookie;
        proxy_cache_valid 200 301 60s;
        proxy_cache_valid 404 10s;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_background_update on;
        proxy_cache_lock on;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header X-Robots-Tag $fgb_robots always;
        add_header X-Cache-Status $upstream_cache_status always;
    }
}

# admin
server {
    listen 443 ssl;
    server_name admin.feelgoodbrothers.com;

    ssl_certificate /etc/letsencrypt/live/feelgoodbrothers.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/feelgoodbrothers.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    server_tokens off;
    client_max_body_size 20m;
    gzip on;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;

    resolver 127.0.0.11 valid=10s ipv6=off;
    set $fgb_admin http://fgb-admin:4322;
    proxy_connect_timeout 3s;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $host;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Robots-Tag "noindex, nofollow" always;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # writing assistant streams its answer: don't buffer, allow long generations
    location /api/ai/ {
        proxy_pass $fgb_admin;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    location ~ ^/posts/[0-9]+/translate/?$ {
        proxy_pass $fgb_admin;
        proxy_read_timeout 300s;
    }

    location = /login {
        limit_req zone=fgb_login burst=5 nodelay;
        proxy_pass $fgb_admin;
    }

    location / {
        proxy_pass $fgb_admin;
        proxy_read_timeout 120s;
    }
}
# END feelgoodbrothers
