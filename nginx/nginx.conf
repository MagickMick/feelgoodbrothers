# Feelgood Brothers – reverse proxy (Docker Swarm, single node)
#   feelgoodbrothers.com        -> web   (Astro SSR, micro-cached)
#   admin.feelgoodbrothers.com  -> admin (never cached, noindex)
#   /media/*                    -> uploads volume (immutable images)
#   new.feelgoodbrothers.com    -> web, noindex (test domain before the DNS switch)

# Docker's embedded DNS; resolve services lazily so nginx starts even if an app is still booting
resolver 127.0.0.11 valid=10s ipv6=off;

# real visitor IP when behind Cloudflare (proxy on)
include /etc/nginx/conf.d/cloudflare-realip.inc;

# micro-cache for public HTML: shields Postgres from traffic spikes (e.g. a viral X post)
proxy_cache_path /var/cache/nginx/web levels=1:2 keys_zone=web:20m max_size=500m inactive=7d use_temp_path=off;

limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;
limit_req_status 429;

gzip on;
gzip_comp_level 5;
gzip_min_length 512;
gzip_proxied any;
gzip_vary on;
gzip_types text/plain text/css text/xml application/xml application/rss+xml application/json application/javascript image/svg+xml;

server_tokens off;
client_max_body_size 20m;

map $host $robots_header {
    new.feelgoodbrothers.com "noindex, nofollow";
    default "";
}

# ---------------------------------------------------------------------------
# HTTP: ACME challenge + redirect to HTTPS
# ---------------------------------------------------------------------------
server {
    listen 80 default_server;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------------------------------------------------------------------------
# www -> apex
# ---------------------------------------------------------------------------
server {
    listen 443 ssl;
    http2 on;
    server_name www.feelgoodbrothers.com;

    ssl_certificate /etc/letsencrypt/live/feelgoodbrothers.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/feelgoodbrothers.com/privkey.pem;
    include /etc/nginx/conf.d/ssl.inc;

    return 301 https://feelgoodbrothers.com$request_uri;
}

# ---------------------------------------------------------------------------
# public site
# ---------------------------------------------------------------------------
server {
    listen 443 ssl default_server;
    http2 on;
    server_name feelgoodbrothers.com new.feelgoodbrothers.com;

    ssl_certificate /etc/letsencrypt/live/feelgoodbrothers.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/feelgoodbrothers.com/privkey.pem;
    include /etc/nginx/conf.d/ssl.inc;

    # note: add_header in a location replaces these, so locations include the file again
    include /etc/nginx/conf.d/security-headers.inc;
    add_header X-Robots-Tag $robots_header always;

    set $web_upstream http://web:4321;

    # uploaded images: served straight from the volume, cached forever (unique filenames)
    location /media/ {
        alias /data/uploads/;
        access_log off;
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # hashed build assets
    location /_astro/ {
        proxy_pass $web_upstream;
        include /etc/nginx/conf.d/proxy-headers.inc;
        proxy_cache web;
        proxy_cache_valid 200 30d;
        access_log off;
    }

    location / {
        proxy_pass $web_upstream;
        include /etc/nginx/conf.d/proxy-headers.inc;

        proxy_cache web;
        proxy_cache_key "$scheme$host$request_uri";
        proxy_cache_methods GET HEAD;
        proxy_ignore_headers Cache-Control Expires Set-Cookie;
        proxy_cache_valid 200 301 60s;
        proxy_cache_valid 404 10s;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_background_update on;
        proxy_cache_lock on;
        include /etc/nginx/conf.d/security-headers.inc;
        add_header X-Robots-Tag $robots_header always;
        add_header X-Cache-Status $upstream_cache_status always;
    }
}

# ---------------------------------------------------------------------------
# admin
# ---------------------------------------------------------------------------
server {
    listen 443 ssl;
    http2 on;
    server_name admin.feelgoodbrothers.com;

    ssl_certificate /etc/letsencrypt/live/feelgoodbrothers.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/feelgoodbrothers.com/privkey.pem;
    include /etc/nginx/conf.d/ssl.inc;

    include /etc/nginx/conf.d/security-headers.inc;
    add_header X-Robots-Tag "noindex, nofollow" always;

    set $admin_upstream http://admin:4322;

    location /media/ {
        alias /data/uploads/;
        expires max;
        try_files $uri =404;
    }

    # writing assistant streams its answer: don't buffer, allow long generations
    location /api/ai/ {
        proxy_pass $admin_upstream;
        include /etc/nginx/conf.d/proxy-headers.inc;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    location ~ ^/posts/[0-9]+/translate/?$ {
        proxy_pass $admin_upstream;
        include /etc/nginx/conf.d/proxy-headers.inc;
        proxy_read_timeout 300s;
    }

    location = /login {
        limit_req zone=login burst=5 nodelay;
        proxy_pass $admin_upstream;
        include /etc/nginx/conf.d/proxy-headers.inc;
    }

    location / {
        proxy_pass $admin_upstream;
        include /etc/nginx/conf.d/proxy-headers.inc;
        proxy_read_timeout 120s;
    }
}
