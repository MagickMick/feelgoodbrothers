# Production stack "feelgoodbrothers" (Docker Swarm). Runs next to the stacks "weggeefdeals" and
# "tintexclusive" on the Weggeefdeals VPS (docker context "weggeefdeals"). Deploy with ./deploy.sh.
#
# nginx + certbot belong to the Weggeefdeals stack (it owns ports 80/443). fgb-web and fgb-admin
# join its network so nginx can reach them; see nginx/feelgoodbrothers.conf.
#
# All services are prefixed "fgb-": Weggeefdeals also has services called "admin" and "postgres"
# on the shared network, and short names there would resolve to the wrong container. Postgres and
# the backup job are only on the private network "fgb".
#
# Host paths: /opt/feelgoodbrothers/uploads (images) and /opt/feelgoodbrothers/backups.
#
#   docker --context weggeefdeals stack services feelgoodbrothers
#   docker --context weggeefdeals service logs -f feelgoodbrothers_fgb-web

x-app-env: &app-env
  NODE_ENV: production
  DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@fgb-postgres:5432/${POSTGRES_DB}
  SITE_URL: ${SITE_URL:-https://feelgoodbrothers.com}
  ADMIN_URL: ${ADMIN_URL:-https://admin.feelgoodbrothers.com}
  ADMIN_TIMEZONE: ${ADMIN_TIMEZONE:-Europe/Amsterdam}
  CLOUDFLARE_ZONE_ID: ${CLOUDFLARE_ZONE_ID:-}
  CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN:-}
  INDEXNOW_KEY: ${INDEXNOW_KEY:-}
  UPLOADS_DIR: /data/uploads

x-ai-env: &ai-env
  AI_PROVIDER: ${AI_PROVIDER:-openai}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  OPENAI_MODEL: ${OPENAI_MODEL:-}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-}

# zero-downtime rolling updates: start the new container before stopping the old one
x-rolling: &rolling
  update_config:
    order: start-first
    failure_action: rollback
    monitor: 30s
  rollback_config:
    order: start-first
  restart_policy:
    condition: any
    delay: 5s

services:
  fgb-web:
    image: feelgoodbrothers-web:${TAG:-latest}
    environment: *app-env
    volumes:
      - /opt/feelgoodbrothers/uploads:/data/uploads:ro
    networks: [fgb, shared]
    deploy:
      replicas: 1
      <<: *rolling
      resources:
        limits:
          memory: 384M

  fgb-admin:
    image: feelgoodbrothers-admin:${TAG:-latest}
    # only the admin gets the AI keys
    environment:
      <<: [*app-env, *ai-env]
    volumes:
      - /opt/feelgoodbrothers/uploads:/data/uploads
    networks: [fgb, shared]
    deploy:
      replicas: 1
      <<: *rolling
      resources:
        limits:
          memory: 512M

  fgb-postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [fgb]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      replicas: 1
      restart_policy:
        condition: any
        delay: 5s
      resources:
        limits:
          memory: 512M

  # daily backup: database dump + uploads archive, keeps the last 14 of each
  fgb-backup:
    image: postgres:17-alpine
    environment:
      PGHOST: fgb-postgres
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
    volumes:
      - /opt/feelgoodbrothers/backups:/backups
      - /opt/feelgoodbrothers/uploads:/data/uploads:ro
    networks: [fgb]
    entrypoint:
      - /bin/sh
      - -c
      - |
        trap exit TERM
        sleep 120
        while :; do
          ts=$$(date +%Y%m%d-%H%M)
          if pg_dump -Fc -f /backups/db-$$ts.dump; then echo "db backup ok: db-$$ts.dump"; else echo "db backup FAILED"; fi
          tar -czf /backups/uploads-$$ts.tar.gz -C /data uploads && echo "uploads backup ok"
          ls -1t /backups/db-*.dump 2>/dev/null | tail -n +15 | xargs -r rm -f
          ls -1t /backups/uploads-*.tar.gz 2>/dev/null | tail -n +15 | xargs -r rm -f
          sleep 86400 & wait $$!
        done
    deploy:
      restart_policy:
        condition: any
      resources:
        limits:
          memory: 128M

networks:
  fgb:
    driver: overlay
  # the network of the Weggeefdeals stack, where its nginx lives
  shared:
    external: true
    name: weggeefdeals_default

volumes:
  postgres_data:
