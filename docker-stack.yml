# Production stack (Docker Swarm, single VPS). Deployed by ./deploy.sh as stack "feelgoodbrothers".
# Lives on the VPS at /opt/feelgoodbrothers/docker-stack.yml next to .env, nginx/, certbot/, uploads/, backups/.
#
#   docker --context feelgoodbrothers stack services feelgoodbrothers
#   docker --context feelgoodbrothers service logs -f feelgoodbrothers_web

x-app-env: &app-env
  NODE_ENV: production
  DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
  SITE_URL: ${SITE_URL:-https://feelgoodbrothers.com}
  ADMIN_URL: ${ADMIN_URL:-https://admin.feelgoodbrothers.com}
  ADMIN_TIMEZONE: ${ADMIN_TIMEZONE:-Europe/Amsterdam}
  CLOUDFLARE_ZONE_ID: ${CLOUDFLARE_ZONE_ID:-}
  CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN:-}
  INDEXNOW_KEY: ${INDEXNOW_KEY:-}
  UPLOADS_DIR: /data/uploads

x-ai-env: &ai-env
  AI_PROVIDER: ${AI_PROVIDER:-openai}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  OPENAI_MODEL: ${OPENAI_MODEL:-}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-}

# zero-downtime rolling updates: start the new container before stopping the old one
x-rolling: &rolling
  update_config:
    order: start-first
    failure_action: rollback
    monitor: 30s
  rollback_config:
    order: start-first
  restart_policy:
    condition: any
    delay: 5s

services:
  nginx:
    image: nginx:1.29-alpine
    ports:
      - target: 80
        published: 80
        mode: host
      - target: 443
        published: 443
        mode: host
    volumes:
      - /opt/feelgoodbrothers/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /opt/feelgoodbrothers/nginx/ssl.inc:/etc/nginx/conf.d/ssl.inc:ro
      - /opt/feelgoodbrothers/nginx/security-headers.inc:/etc/nginx/conf.d/security-headers.inc:ro
      - /opt/feelgoodbrothers/nginx/proxy-headers.inc:/etc/nginx/conf.d/proxy-headers.inc:ro
      - /opt/feelgoodbrothers/nginx/cloudflare-realip.inc:/etc/nginx/conf.d/cloudflare-realip.inc:ro
      - /opt/feelgoodbrothers/certbot/conf:/etc/letsencrypt:ro
      - /opt/feelgoodbrothers/certbot/www:/var/www/certbot:ro
      - /opt/feelgoodbrothers/uploads:/data/uploads:ro
      - nginx_cache:/var/cache/nginx
    # reload every 6h so renewed certificates are picked up
    command: '/bin/sh -c ''while :; do sleep 6h & wait $${!}; nginx -s reload; done & nginx -g "daemon off;"'''
    deploy:
      restart_policy:
        condition: any

  certbot:
    image: certbot/certbot:latest
    volumes:
      - /opt/feelgoodbrothers/certbot/conf:/etc/letsencrypt
      - /opt/feelgoodbrothers/certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done;'"
    deploy:
      restart_policy:
        condition: any

  web:
    image: magickmick/feelgoodbrothers-web:${TAG:-latest}
    environment: *app-env
    volumes:
      - /opt/feelgoodbrothers/uploads:/data/uploads:ro
    deploy:
      replicas: 1
      <<: *rolling

  admin:
    image: magickmick/feelgoodbrothers-admin:${TAG:-latest}
    # only the admin gets the AI keys
    environment:
      <<: [*app-env, *ai-env]
    volumes:
      - /opt/feelgoodbrothers/uploads:/data/uploads
    deploy:
      replicas: 1
      <<: *rolling

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      replicas: 1
      restart_policy:
        condition: any
        delay: 5s

  # daily backup: database dump + uploads archive, keeps the last 14 of each
  backup:
    image: postgres:17-alpine
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
    volumes:
      - /opt/feelgoodbrothers/backups:/backups
      - /opt/feelgoodbrothers/uploads:/data/uploads:ro
    entrypoint:
      - /bin/sh
      - -c
      - |
        trap exit TERM
        sleep 120
        while :; do
          ts=$$(date +%Y%m%d-%H%M)
          if pg_dump -Fc -f /backups/db-$$ts.dump; then echo "db backup ok: db-$$ts.dump"; else echo "db backup FAILED"; fi
          tar -czf /backups/uploads-$$ts.tar.gz -C /data uploads && echo "uploads backup ok"
          ls -1t /backups/db-*.dump 2>/dev/null | tail -n +15 | xargs -r rm -f
          ls -1t /backups/uploads-*.tar.gz 2>/dev/null | tail -n +15 | xargs -r rm -f
          sleep 86400 & wait $$!
        done
    deploy:
      restart_policy:
        condition: any

volumes:
  postgres_data:
  nginx_cache:
